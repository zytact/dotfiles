palette = "vscode_dark_plus"
add_newline = false
command_timeout = 2000
scan_timeout = 50

format = """
[](fg:mauve)$os$directory[](fg:lavender bg:surface0)$git_branch$git_status[](fg:surface0 bg:surface1)$python$nodejs$rust$golang$lua[](fg:surface1)
$character
"""

right_format = """
[](fg:surface2)$cmd_duration$time$status[](fg:surface2)
"""

[palettes.vscode_dark_plus]
rosewater = "#d4d4d4"
flamingo = "#c8c8c8"
pink = "#c586c0"
mauve = "#c586c0"
red = "#f44747"
maroon = "#d16969"
peach = "#ce9178"
yellow = "#dcdcaa"
green = "#6a9955"
teal = "#4ec9b0"
sky = "#4fc1ff"
sapphire = "#4ec9b0"
blue = "#569cd6"
lavender = "#3794ff"
text = "#d4d4d4"
subtext1 = "#c8c8c8"
subtext0 = "#9da1a6"
overlay2 = "#858585"
overlay1 = "#6e7681"
overlay0 = "#5c6370"
surface2 = "#3e3e42"
surface1 = "#2d2d30"
surface0 = "#252526"
base = "#1e1e1e"
mantle = "#181818"
crust = "#111111"
line = "#3e3e42"
fg = "#d4d4d4"
select = "#264f78"

[os]
disabled = false
style = "fg:crust bg:mauve bold"
format = "[ $symbol ]($style)"

[os.symbols]
Fedora = ""
Macos = ""
Ubuntu = ""
Arch = ""
Debian = ""
NixOS = ""
Linux = "󰌽"
Unknown = "󰘔"
Windows = "󰍲"

[directory]
style = "fg:crust bg:lavender bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:text bg:surface0 bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:yellow bg:surface0 bold"
format = "([$all_status$ahead_behind ]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "✘${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
untracked = "?${count}"
stashed = "*${count}"

[python]
symbol = " "
style = "fg:yellow bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = "󰎙 "
style = "fg:green bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[rust]
symbol = "󱘗 "
style = "fg:peach bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "fg:sapphire bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[lua]
symbol = " "
style = "fg:mauve bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[cmd_duration]
min_time = 500
style = "fg:peach bg:surface2"
format = "[  $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:text bg:surface2"
format = "[ 󰥔 $time ]($style)"

[status]
disabled = false
symbol = "✘"
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = "󰅙"
sigint_symbol = ""
style = "fg:red bg:surface2 bold"
format = "([$symbol $status ]($style))"
map_symbol = true

[character]
success_symbol = "[❯](bold fg:mauve)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
