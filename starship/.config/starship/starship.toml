[os]
disabled = false
style = "fg:crust bg:mauve bold"
format = "[ $symbol ]($style)"

[os.symbols]
Fedora = ""
Macos = ""
Ubuntu = ""
Arch = ""
Debian = ""
NixOS = ""
Linux = "󰌽"
Unknown = "󰘔"
Windows = "󰍲"

[directory]
style = "fg:crust bg:lavender bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:text bg:surface0 bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:yellow bg:surface0 bold"
format = "([$all_status$ahead_behind ]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "✘${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
untracked = "?${count}"
stashed = "*${count}"

[python]
symbol = " "
style = "fg:yellow bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = "󰎙 "
style = "fg:green bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[rust]
symbol = "󱘗 "
style = "fg:peach bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "fg:sapphire bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[lua]
symbol = " "
style = "fg:mauve bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[cmd_duration]
min_time = 500
style = "fg:peach bg:surface2"
format = "[  $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:text bg:surface2"
format = "[ 󰥔 $time ]($style)"

[status]
disabled = false
symbol = "✘"
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = "󰅙"
sigint_symbol = ""
style = "fg:red bg:surface2 bold"
format = "([$symbol $status ]($style))"
map_symbol = true

[character]
success_symbol = "[❯](bold fg:mauve)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
