palette = "catppuccin_mocha"
add_newline = false
command_timeout = 2000
scan_timeout = 50

format = """
[](fg:mauve)$os$directory[](fg:lavender bg:surface0)$git_branch$git_status[](fg:surface0 bg:surface1)$python$nodejs$rust$golang$lua[](fg:surface1)
$character
"""

right_format = """
[](fg:surface2)$cmd_duration$time$status[](fg:surface2)
"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
line = "#6c7086"
fg = "#cdd6f4"
select = "#313244"

[os]
disabled = false
style = "fg:crust bg:mauve bold"
format = "[ $symbol ]($style)"

[os.symbols]
Fedora = ""
Macos = ""
Ubuntu = ""
Arch = ""
Debian = ""
NixOS = ""
Linux = "󰌽"
Unknown = "󰘔"
Windows = "󰍲"

[directory]
style = "fg:crust bg:lavender bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:text bg:surface0 bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:yellow bg:surface0 bold"
format = "([$all_status$ahead_behind ]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
deleted = "✘${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
untracked = "?${count}"
stashed = "*${count}"

[python]
symbol = " "
style = "fg:yellow bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = "󰎙 "
style = "fg:green bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[rust]
symbol = "󱘗 "
style = "fg:peach bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "fg:sapphire bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[lua]
symbol = " "
style = "fg:mauve bg:surface1 bold"
format = "[ $symbol$version ]($style)"

[cmd_duration]
min_time = 500
style = "fg:peach bg:surface2"
format = "[  $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "fg:text bg:surface2"
format = "[ 󰥔 $time ]($style)"

[status]
disabled = false
symbol = "✘"
success_symbol = ""
not_executable_symbol = ""
not_found_symbol = "󰅙"
sigint_symbol = ""
style = "fg:red bg:surface2 bold"
format = "([$symbol $status ]($style))"
map_symbol = true

[character]
success_symbol = "[❯](bold fg:mauve)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
